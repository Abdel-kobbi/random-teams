<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random-teams</title>
  <link rel="stylesheet" href="/src/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
</head>

<body class="">
  <div id="app" class="grid place-items-center w-[80%] h-screen mt-1 mx-auto">
    <h1 class="text-center w-full text-3xl font-bold">Generate random equipe</h1>
    <form action="" class="w-full m-auto" id="form">
      <input type="text" id="name" placeholder="Alex" class="input" required>
      <input type="submit" value="Ajouter" class="btn block mt-4 w-75 mx-auto">
    </form>
    <div class="flex justify-between gap-5 w-full">
      <button class="btn" id="reset" title="Supprimer tous les nom">Réinitialiser</button>
      <button id="openModal" class="btn">
        Generate equipes
      </button>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
      <div class="bg-white  rounded-lg shadow-lg  max-w-full w-1/3 p-6 relative">
        <!-- Bouton de fermeture -->
        <button id="closeModal"
          class="absolute text-4xl top-2 right-2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 hover:cursor-pointer">
          &times;
        </button>

        <!-- Contenu du modal -->
        <h2 class="text-xl font-bold mb-4 text-gray-900">Combien de personnes dans chaque équipe ?</h2>
        <p class="text-gray-700 mb-4">
          <input type="number" placeholder="Combien de personnes dans chaque équipe" class="input w-full"
            id="numberOfTeam">
          <small id="error" class="text-red-600"></small>
        </p>
        <button id="generate"
          class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded hover:cursor-pointer block w-1/2 m-auto">
          Generate
        </button>
      </div>
    </div>

    <table id="table" class="border-collapse border border-gray-400  w-full mx-auto text-center">
      <thead>
        <tr class="table-dark">
          <th class="border-2">#ID</th>
          <th class="border-2">Nom</th>
          <th class="border-2">Group</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="3" class="border-2 font-semibold">Rien a afficher</td>
        </tr>
      </tbody>
    </table>
    <div id="caption"
      style="width: 100px; height: 20px; background-color: lightgreen; font-weight: bold; display: none;">Leader team
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 my-4 w-full" id="card-teams">
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
